<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>LinkyShrinky | Dashboard</title>
    <link href="style.css" rel="stylesheet"/>
    <script src="script.js"></script>
</head>
<body>
    <h1>LinkyShrinky | Dashboard</h1>

    <form action="./apikeys">
        <input type="submit" value="API Keys" />
    </form>

    <form method="post" action="../logout">
        <input type="submit" value="Log Out" />
    </form>

    <div class="card">
        <form id="form">
            <h2>Shorten a URL</h2>

            <label for="redirect">Redirect URL</label>
            <input id="redirect" type="url" name="redirect" placeholder="https://example.com" required>

            <label for="slug">Custom Slug (optional)</label>
            <input id="slug" type="text" name="slug" pattern="[a-zA-Z0-9_-]*" autocomplete="off" placeholder="ex">

            <input type="submit" value="Create Short Link">
        </form>
    </div>

    <div class="card" id="table-card">
        <table>
            <thead>
                <tr>
                    <th>Slug</th>
                    <th>Redirect</th>
                    <th>Hits</th>
                    <th>Created</th>
                    <th>Last Hit</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tablebody">
            </tbody>
        </table>
    </div>
</body>
</html>
