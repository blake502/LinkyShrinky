<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>LinkyShrink | API Keys</title>
    <link href="style.css" rel="stylesheet"/>
    <script src="script.js"></script>
</head>
<body>
    <h1>LinkyShrink | API Keys</h1>

    <form action="../">
        <input type="submit" value="Dashboard" />
    </form>

    <form method="post" action="../../logout">
        <input type="submit" value="Log Out" />
    </form>

    <div class="card">
        <form id="form">
            <h2>Request an API Key</h2>

            <label for="name">Name</label>
            <input id="name" type="text" name="name" placeholder="API Key Name" required>

            <input type="submit" value="Request API Key">
        </form>
        <h2 id="key">
        </h2>
    </div>

    <div class="card" id="table-card">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Created</th>
                    <th>Last Used</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tablebody">
            </tbody>
        </table>
    </div>
</body>
</html>
