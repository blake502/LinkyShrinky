<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Login</title>
    <link href="style.css" rel="stylesheet" />
</head>
<body>
    <div class="login-card">
        <form method="post" action="login">
            <h1>Login</h1>

            <div class="error" id="error" style="display: none">
                Error occurred!
            </div>

            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" autofocus required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="password" required>

            <input type="submit" value="Sign In">
        </form>
    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);

            var errorElem = document.getElementById("error");
            var errorCode = params.get("error");
            if (errorElem != null && errorCode != null) {
                if (errorCode == "1") {
                    errorElem.textContent = "Incorrect username or password"
                }

                if (errorCode == "2") {
                    errorElem.textContent = "Too many attempts!"
                }

                errorElem.style.display = "block";
            }
        }
    </script>
</body>
</html>
